[project]
name = "price-compare"
version = "0.2.0"
description = "Live price comparison API and dashboard for Blinkit vs Zepto, powered by crawl4ai"
requires-python = ">=3.10"
dependencies = [
    "crawl4ai==0.9.3",
    "rapidfuzz>=3.10",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
price-compare-cli = "price_compare.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
price_compare = ["web/*"]
